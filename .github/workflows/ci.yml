name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        # No model is needed: tests use ScriptedLLM and a mocked Ollama transport.
        run: pytest

  postgres:
    # The same test suite against a real PostgreSQL server instead of in-memory SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway container that only exists for this job.
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: bank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d bank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COPILOT_TEST_DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/bank_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Test against PostgreSQL
        run: pytest
