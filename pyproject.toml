[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-copilot-redteam"
version = "0.1.0"
description = "A banking AI assistant built to be red-teamed and validated (fictional bank, synthetic data)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "faker>=24",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
# PostgreSQL driver. SQLite needs nothing extra, so this stays optional.
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["app*", "redteam*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
